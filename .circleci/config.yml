version: 2.1

jobs:
  build_android:

    docker:
      - image: cimg/android:2026.08.1-ndk

    resource_class: large

    working_directory: ~/project

    steps:

      # ============================================================
      # 1. DOWNLOAD PROJECT
      # ============================================================
      - checkout


      # ============================================================
      # 2. CHECK ENVIRONMENT
      # ============================================================
      - run:
          name: Check environment
          command: |
            set -eux

            echo "===== PROJECT ====="
            pwd
            ls -la

            echo "===== PYTHON ====="
            python3 --version

            echo "===== JAVA ====="
            java -version

            echo "===== ANDROID ====="
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

            echo "===== TOOLS ====="
            command -v sdkmanager || true
            command -v git
            command -v python3


      # ============================================================
      # 3. INSTALL SYSTEM DEPENDENCIES
      # ============================================================
      - run:
          name: Install system dependencies
          command: |
            set -eux

            sudo apt-get update

            sudo apt-get install -y \
              git \
              zip \
              unzip \
              openjdk-17-jdk \
              python3 \
              python3-dev \
              python3-pip \
              python3-venv \
              autoconf \
              automake \
              autopoint \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libtinfo6 \
              cmake \
              libffi-dev \
              libssl-dev \
              gettext \
              build-essential \
              ccache \
              patch \
              wget

            echo "===== JAVA ====="
            java -version

            echo "===== PYTHON ====="
            python3 --version


      # ============================================================
      # 4. CONFIGURE JAVA 17
      # ============================================================
      - run:
          name: Configure Java 17
          command: |
            set -eux

            JAVA_17_HOME="/usr/lib/jvm/java-17-openjdk-amd64"

            if [ ! -d "$JAVA_17_HOME" ]
            then
              JAVA_17_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
            fi

            test -d "$JAVA_17_HOME"

            echo "export JAVA_HOME=$JAVA_17_HOME" >> "$BASH_ENV"
            echo 'export PATH=$JAVA_HOME/bin:$PATH' >> "$BASH_ENV"

            source "$BASH_ENV"

            echo "JAVA_HOME=$JAVA_HOME"

            java -version
            javac -version


      # ============================================================
      # 5. CREATE PYTHON BUILD ENVIRONMENT
      # ============================================================
      - run:
          name: Install Buildozer Cython Pytest and NumPy
          command: |
            set -eux

            rm -rf ~/buildozer-venv

            python3 -m venv ~/buildozer-venv

            source ~/buildozer-venv/bin/activate

            python -m pip install --upgrade \
              pip \
              setuptools \
              wheel

            python -m pip install \
              "Cython==0.29.34"

            python -m pip install \
              pytest

            # ======================================================
            # NUMPY FOR PROJECT TESTS
            # ======================================================
            python -m pip install \
              numpy

            python -m pip install \
              git+https://github.com/kivy/buildozer.git

            echo "===== INSTALLED PACKAGES ====="

            python -m pip show Cython
            python -m pip show pytest
            python -m pip show numpy
            python -m pip show buildozer

            echo "===== VERIFY NUMPY ====="

            python -c "import numpy; print('NumPy version:', numpy.__version__)"

            echo "===== VERSIONS ====="

            python --version
            cython --version
            pytest --version
            buildozer --version


      # ============================================================
      # 6. VALIDATE PROJECT FILES
      # ============================================================
      - run:
          name: Validate project files
          command: |
            set -eux

            test -f main.py
            test -f buildozer.spec
            test -f models/gothic_ocr.tflite
            test -f data/labels.json

            test -f fonts/NotoSansGothic-Regular.ttf

            test -f services/__init__.py
            test -f services/image_service.py
            test -f services/model_service.py
            test -f services/text_decoder.py
            test -f services/cache_service.py

            test -f tests/test_decoder.py
            test -f tests/test_image_service.py

            echo "All required project files found."


      # ============================================================
      # 7. VALIDATE PYTHON SYNTAX
      # ============================================================
      - run:
          name: Validate Python syntax
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            python -m compileall -q \
              main.py \
              services \
              tests

            echo "Python syntax validation successful."


      # ============================================================
      # 8. RUN PROJECT TESTS
      # ============================================================
      - run:
          name: Run Python tests
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            echo "===== VERIFYING NUMPY BEFORE TESTS ====="

            python -c "import numpy; print('NumPy is ready:', numpy.__version__)"

            echo "===== RUNNING PYTEST ====="

            pytest -q

            echo "===== ALL TESTS PASSED ====="


      # ============================================================
      # 9. VALIDATE MODEL
      # ============================================================
      - run:
          name: Validate model file
          command: |
            set -eux

            ls -lh models/gothic_ocr.tflite

            MODEL_SIZE=$(stat -c%s models/gothic_ocr.tflite)

            if [ "$MODEL_SIZE" -lt 1000 ]
            then
              echo "ERROR: TFLite model is empty or invalid."
              exit 1
            fi

            echo "Model size: $MODEL_SIZE bytes"
            echo "Model validation successful."


      # ============================================================
      # 10. VALIDATE BUILDOZER CONFIGURATION
      # ============================================================
      - run:
          name: Validate Buildozer configuration
          command: |
            set -eux

            echo "===== CHECKING BUILDOZER CONFIG ====="

            grep -F \
              "android.api = 35" \
              buildozer.spec

            grep -F \
              "android.minapi = 24" \
              buildozer.spec

            grep -F \
              "android.ndk = 28c" \
              buildozer.spec

            grep -F \
              "org.tensorflow:tensorflow-lite:2.17.0" \
              buildozer.spec

            grep -F \
              "requirements = python3,kivy,numpy,pillow,pyjnius" \
              buildozer.spec

            echo "Buildozer configuration validated."


      # ============================================================
      # 11. CONFIGURE ANDROID SDK
      # ============================================================
      - run:
          name: Configure Android SDK
          command: |
            set -eux

            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

            if [ -z "$SDK_ROOT" ]
            then
              echo "ERROR: Android SDK was not found."
              exit 1
            fi

            test -d "$SDK_ROOT"

            echo "export ANDROID_HOME=$SDK_ROOT" >> "$BASH_ENV"
            echo "export ANDROID_SDK_ROOT=$SDK_ROOT" >> "$BASH_ENV"
            echo "export ANDROIDSDK=$SDK_ROOT" >> "$BASH_ENV"

            source "$BASH_ENV"

            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "ANDROIDSDK=$ANDROIDSDK"

            ls -la "$ANDROIDSDK"


      # ============================================================
      # 12. LOCATE SDKMANAGER
      # ============================================================
      - run:
          name: Locate Android sdkmanager
          command: |
            set -eux

            source "$BASH_ENV"

            SDKMANAGER=""

            if [ -f "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager" ]
            then
              SDKMANAGER="$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager"

            elif command -v sdkmanager >/dev/null 2>&1
            then
              SDKMANAGER="$(command -v sdkmanager)"

            else
              FOUND=$(find "$ANDROIDSDK" \
                -type f \
                -path "*/bin/sdkmanager" \
                | head -n 1 || true)

              if [ -n "$FOUND" ]
              then
                SDKMANAGER="$FOUND"
              fi
            fi

            if [ -z "$SDKMANAGER" ]
            then
              echo "ERROR: sdkmanager was not found."
              exit 1
            fi

            chmod +x "$SDKMANAGER" || true

            echo "export SDKMANAGER=$SDKMANAGER" >> "$BASH_ENV"

            echo "SDKMANAGER=$SDKMANAGER"

            "$SDKMANAGER" --version


      # ============================================================
      # 13. ACCEPT ANDROID LICENSES
      # ============================================================
      - run:
          name: Accept Android SDK licenses
          command: |
            set -eux

            source "$BASH_ENV"

            echo "===== ACCEPTING ANDROID LICENSES ====="

            set +e

            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1

            LICENSE_STATUS=${PIPESTATUS[1]}

            set -e

            if [ "$LICENSE_STATUS" -ne 0 ]
            then
              echo "WARNING: License command returned $LICENSE_STATUS"
            fi

            echo "Android license step completed."


      # ============================================================
      # 14. INSTALL REQUIRED ANDROID SDK PACKAGES
      # ============================================================
      - run:
          name: Install Android SDK packages
          command: |
            set -eux

            source "$BASH_ENV"

            echo "===== INSTALLING ANDROID SDK PACKAGES ====="

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"

            echo "===== VERIFY SDK ====="

            test -d "$ANDROIDSDK/platform-tools"

            test -d \
              "$ANDROIDSDK/platforms/android-35"

            test -d \
              "$ANDROIDSDK/build-tools/35.0.0"

            echo "===== SDK PACKAGES INSTALLED ====="


      # ============================================================
      # 15. VERIFY AIDL
      # ============================================================
      - run:
          name: Verify AIDL
          command: |
            set -eux

            source "$BASH_ENV"

            AIDL="$ANDROIDSDK/build-tools/35.0.0/aidl"

            if [ ! -f "$AIDL" ]
            then
              echo "ERROR: AIDL not found."
              echo "$AIDL"
              exit 1
            fi

            chmod +x "$AIDL" || true

            echo "AIDL found:"
            echo "$AIDL"


      # ============================================================
      # 16. LOCATE NDK 28
      # ============================================================
      - run:
          name: Locate Android NDK
          command: |
            set -eux

            source "$BASH_ENV"

            NDK_ROOT=""

            if [ -d "$ANDROIDSDK/ndk/28.2.13676358" ]
            then
              NDK_ROOT="$ANDROIDSDK/ndk/28.2.13676358"

            else
              FOUND_NDK=$(find "$ANDROIDSDK/ndk" \
                -mindepth 1 \
                -maxdepth 1 \
                -type d \
                2>/dev/null \
                | sort \
                | tail -n 1 || true)

              if [ -n "$FOUND_NDK" ]
              then
                NDK_ROOT="$FOUND_NDK"
              fi
            fi

            if [ -z "$NDK_ROOT" ]
            then
              echo "ERROR: Android NDK was not found."
              echo "Available SDK directories:"
              ls -la "$ANDROIDSDK" || true
              exit 1
            fi

            test -d "$NDK_ROOT"

            echo "export ANDROIDNDK=$NDK_ROOT" >> "$BASH_ENV"

            source "$BASH_ENV"

            echo "ANDROIDNDK=$ANDROIDNDK"

            ls -la "$ANDROIDNDK" | head


      # ============================================================
      # 17. CONFIGURE BUILD ENVIRONMENT
      # ============================================================
      - run:
          name: Configure Android Build Environment
          command: |
            set -eux

            source "$BASH_ENV"

            echo "export ANDROIDAPI=35" >> "$BASH_ENV"
            echo "export NDKAPI=24" >> "$BASH_ENV"

            source "$BASH_ENV"

            echo "ANDROIDSDK=$ANDROIDSDK"
            echo "ANDROIDNDK=$ANDROIDNDK"
            echo "ANDROIDAPI=$ANDROIDAPI"
            echo "NDKAPI=$NDKAPI"


      # ============================================================
      # 18. PREPARE BUILDOZER SDK AND NDK PATHS
      # ============================================================
      - run:
          name: Configure Buildozer Android paths
          command: |
            set -eux

            source "$BASH_ENV"

            BUILDOZER_PLATFORM=~/.buildozer/android/platform

            mkdir -p "$BUILDOZER_PLATFORM"

            rm -rf \
              "$BUILDOZER_PLATFORM/android-sdk"

            rm -rf \
              "$BUILDOZER_PLATFORM/android-ndk-r28c"

            ln -s \
              "$ANDROIDSDK" \
              "$BUILDOZER_PLATFORM/android-sdk"

            ln -s \
              "$ANDROIDNDK" \
              "$BUILDOZER_PLATFORM/android-ndk-r28c"

            echo "===== BUILDOZER LINKS ====="

            ls -la "$BUILDOZER_PLATFORM"

            echo "===== SDK LINK ====="

            test -d \
              "$BUILDOZER_PLATFORM/android-sdk"

            echo "===== NDK LINK ====="

            test -d \
              "$BUILDOZER_PLATFORM/android-ndk-r28c"

            echo "===== AIDL ====="

            test -f \
              "$BUILDOZER_PLATFORM/android-sdk/build-tools/35.0.0/aidl"


      # ============================================================
      # 19. CONFIGURE FREETYPE DOWNLOAD FALLBACK
      # ============================================================
      - run:
          name: Configure FreeType fallback mirror
          command: |
            set -eux

            echo "===== CONFIGURING FREETYPE FALLBACK ====="

            echo 'export URL_freetype="https://nongnu.uib.no/freetype/freetype-{version}.tar.gz"' \
              >> "$BASH_ENV"

            source "$BASH_ENV"

            echo "URL_freetype=$URL_freetype"

            echo "===== TESTING FREETYPE MIRROR ====="

            wget \
              --spider \
              --tries=3 \
              --timeout=30 \
              "https://nongnu.uib.no/freetype/freetype-2.14.1.tar.gz"

            echo "FreeType mirror is reachable."


      # ============================================================
      # 20. FINAL PRE-BUILD CHECK
      # ============================================================
      - run:
          name: Final pre-build verification
          command: |
            set -eux

            source "$BASH_ENV"
            source ~/buildozer-venv/bin/activate

            echo "========================================"
            echo "FINAL PRE-BUILD VERIFICATION"
            echo "========================================"

            echo "===== PYTHON ====="
            python --version

            echo "===== NUMPY ====="
            python -c "import numpy; print(numpy.__version__)"

            echo "===== CYTHON ====="
            cython --version

            echo "===== PYTEST ====="
            pytest --version

            echo "===== BUILDOZER ====="
            buildozer --version

            echo "===== JAVA ====="
            java -version
            javac -version

            echo "===== SDK ====="
            echo "$ANDROIDSDK"

            test -d "$ANDROIDSDK"

            echo "===== NDK ====="
            echo "$ANDROIDNDK"

            test -d "$ANDROIDNDK"

            echo "===== SDKMANAGER ====="
            echo "$SDKMANAGER"

            test -f "$SDKMANAGER"

            echo "===== AIDL ====="

            test -f \
              "$ANDROIDSDK/build-tools/35.0.0/aidl"

            echo "===== FREETYPE ====="
            echo "$URL_freetype"

            echo "===== DISK ====="
            df -h

            echo "===== FINAL PYTEST ====="

            pytest -q

            echo "========================================"
            echo "PRE-BUILD VALIDATION PASSED"
            echo "========================================"


      # ============================================================
      # 21. CLEAN OLD OUTPUT
      # ============================================================
      - run:
          name: Clean old output
          command: |
            set -eux

            rm -rf bin

            echo "Old output removed."


      # ============================================================
      # 22. BUILD APK
      # ============================================================
      - run:
          name: Build Android APK
          no_output_timeout: 30m
          command: |
            set -eux

            source "$BASH_ENV"
            source ~/buildozer-venv/bin/activate

            echo "========================================"
            echo "ACTIVE BUILD ENVIRONMENT"
            echo "========================================"

            echo "JAVA_HOME=$JAVA_HOME"

            echo "ANDROIDSDK=$ANDROIDSDK"

            echo "ANDROIDNDK=$ANDROIDNDK"

            echo "ANDROIDAPI=$ANDROIDAPI"

            echo "NDKAPI=$NDKAPI"

            echo "SDKMANAGER=$SDKMANAGER"

            echo "URL_freetype=$URL_freetype"

            echo "========================================"

            echo "===== JAVA ====="

            java -version
            javac -version

            echo "===== PYTHON ====="

            python --version

            echo "===== NUMPY ====="

            python -c "import numpy; print(numpy.__version__)"

            echo "===== CYTHON ====="

            cython --version

            echo "===== BUILDOZER ====="

            buildozer --version

            echo "===== START BUILD ====="

            buildozer -v android debug


      # ============================================================
      # 23. VERIFY APK
      # ============================================================
      - run:
          name: Verify generated APK
          command: |
            set -eux

            if [ ! -d bin ]
            then
              echo "ERROR: bin directory does not exist."
              exit 1
            fi

            echo "===== APK FILES ====="

            find bin \
              -type f \
              -name "*.apk" \
              -print

            APK_COUNT=$(
              find bin \
                -type f \
                -name "*.apk" \
                | wc -l
            )

            if [ "$APK_COUNT" -lt 1 ]
            then
              echo "ERROR: No APK generated."
              exit 1
            fi

            echo "===== APK DETAILS ====="

            find bin \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

            echo "========================================"
            echo "APK BUILD SUCCESSFUL"
            echo "========================================"


      # ============================================================
      # 24. SAVE APK
      # ============================================================
      - store_artifacts:
          path: bin
          destination: GothicOCR-APK


workflows:

  build_android:

    jobs:

      - build_android
