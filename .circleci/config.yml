version: 2.1

jobs:
  build_android:
    docker:
      - image: cimg/android:2026.08.1-ndk

    resource_class: large

    working_directory: ~/project

    steps:
      # ============================================================
      # 1. DOWNLOAD PROJECT
      # ============================================================
      - checkout


      # ============================================================
      # 2. CHECK ENVIRONMENT
      # ============================================================
      - run:
          name: Check environment
          command: |
            set -eux

            echo "===== PROJECT ====="
            pwd
            ls -la

            echo "===== PYTHON ====="
            python3 --version

            echo "===== JAVA ====="
            java -version

            echo "===== ANDROID ====="
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

            command -v sdkmanager || true
            command -v git || true


      # ============================================================
      # 3. INSTALL ALL SYSTEM DEPENDENCIES
      # ============================================================
      - run:
          name: Install system dependencies
          command: |
            set -eux

            sudo apt-get update

            sudo apt-get install -y \
              git \
              zip \
              unzip \
              openjdk-17-jdk \
              python3 \
              python3-dev \
              python3-pip \
              python3-venv \
              autoconf \
              automake \
              autopoint \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libtinfo6 \
              cmake \
              libffi-dev \
              libssl-dev \
              gettext \
              build-essential \
              ccache \
              patch \
              wget

            java -version
            python3 --version


      # ============================================================
      # 4. CREATE PYTHON BUILD ENVIRONMENT
      # ============================================================
      - run:
          name: Install Buildozer and Cython
          command: |
            set -eux

            rm -rf ~/buildozer-venv

            python3 -m venv ~/buildozer-venv

            source ~/buildozer-venv/bin/activate

            python -m pip install --upgrade \
              pip \
              setuptools \
              wheel

            python -m pip install \
              "Cython==0.29.34" \
              "buildozer==1.6.0"

            echo "===== INSTALLED PACKAGES ====="

            python -m pip show Cython
            python -m pip show buildozer

            echo "===== VERIFY CYTHON ====="
            cython --version

            echo "===== VERIFY BUILDOZER ====="
            buildozer --version


      # ============================================================
      # 5. VALIDATE PROJECT FILES
      # ============================================================
      - run:
          name: Validate project files
          command: |
            set -eux

            echo "===== PROJECT FILES ====="

            test -f main.py
            test -f buildozer.spec

            test -f models/gothic_ocr.tflite
            test -f data/labels.json
            test -f fonts/NotoSansGothic-Regular.ttf

            test -f services/__init__.py
            test -f services/image_service.py
            test -f services/model_service.py
            test -f services/text_decoder.py

            echo "===== JAVA BRIDGE ====="

            test -f java/org/gothicocr/TFLiteBridge.java

            echo "All required project files found."


      # ============================================================
      # 6. VALIDATE PYTHON SYNTAX
      # ============================================================
      - run:
          name: Validate Python syntax
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            python -m compileall -q \
              main.py \
              services \
              tests

            echo "Python syntax validation successful."


      # ============================================================
      # 7. VALIDATE TFLITE CONFIGURATION
      # ============================================================
      - run:
          name: Validate TensorFlow Lite configuration
          command: |
            set -eux

            echo "===== TFLITE GRADLE DEPENDENCY ====="

            grep -F \
              "org.tensorflow:tensorflow-lite" \
              buildozer.spec

            echo "===== JAVA SOURCE CONFIG ====="

            grep -E \
              '^android.add_src[[:space:]]*=[[:space:]]*java' \
              buildozer.spec

            echo "===== TFLITE JAVA BRIDGE ====="

            grep -F \
              "class TFLiteBridge" \
              java/org/gothicocr/TFLiteBridge.java

            echo "TensorFlow Lite configuration validated."


      # ============================================================
      # 8. VALIDATE BUILDOZER
      # ============================================================
      - run:
          name: Validate Buildozer
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            command -v python
            command -v cython
            command -v buildozer

            python --version
            cython --version
            buildozer --version

            test -f buildozer.spec

            echo "===== BUILDOZER CONFIGURATION ====="

            grep -E \
              '^(title|package.name|package.domain|version|source.dir|source.include_exts|requirements|android.api|android.minapi|android.archs|android.ndk|android.gradle_dependencies|android.add_src|p4a.branch)' \
              buildozer.spec || true


      # ============================================================
      # 9. VALIDATE ANDROID SDK
      # ============================================================
      - run:
          name: Validate Android SDK
          command: |
            set -eux

            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

            if command -v sdkmanager >/dev/null 2>&1
            then
              sdkmanager --version
            else
              echo "ERROR: sdkmanager is not in PATH"
              exit 1
            fi


      # ============================================================
      # 10. ACCEPT ANDROID SDK LICENSES
      # ============================================================
      - run:
          name: Accept Android SDK licenses
          command: |
            set -eux

            echo "===== ACCEPT ANDROID LICENSES ====="

            yes | sdkmanager --licenses || true

            echo "Android SDK licenses processed."


      # ============================================================
      # 11. INSTALL REQUIRED ANDROID SDK PACKAGES
      # ============================================================
      - run:
          name: Install Android SDK packages
          command: |
            set -eux

            echo "===== INSTALL PLATFORM TOOLS ====="

            sdkmanager \
              "platform-tools"

            echo "===== INSTALL ANDROID PLATFORM ====="

            sdkmanager \
              "platforms;android-35"

            echo "===== INSTALL BUILD TOOLS ====="

            sdkmanager \
              "build-tools;37.0.0"

            echo "===== INSTALLED BUILD TOOLS ====="

            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

            if [ -z "$SDK_ROOT" ]
            then
              echo "ERROR: Android SDK path is not defined."
              exit 1
            fi

            ls -la "$SDK_ROOT/build-tools"

            echo "Android SDK packages installed."


      # ============================================================
      # 12. VERIFY AIDL
      # ============================================================
      - run:
          name: Verify AIDL
          command: |
            set -eux

            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

            echo "===== SEARCH FOR AIDL ====="

            find "$SDK_ROOT/build-tools" \
              -type f \
              -name aidl \
              -print

            AIDL_PATH=$(find "$SDK_ROOT/build-tools" \
              -type f \
              -name aidl \
              | head -1)

            if [ -z "$AIDL_PATH" ]
            then
              echo "ERROR: AIDL was not found."
              exit 1
            fi

            echo "AIDL found:"
            echo "$AIDL_PATH"

            "$AIDL_PATH" --help >/dev/null 2>&1 || true

            echo "AIDL verification successful."


      # ============================================================
      # 13. VALIDATE MODEL SIZE
      # ============================================================
      - run:
          name: Validate model file
          command: |
            set -eux

            echo "===== MODEL FILE ====="

            ls -lh models/gothic_ocr.tflite

            MODEL_SIZE=$(stat -c%s models/gothic_ocr.tflite)

            if [ "$MODEL_SIZE" -lt 1000 ]
            then
              echo "ERROR: TFLite model appears invalid or empty"
              exit 1
            fi

            echo "Model file validation successful."


      # ============================================================
      # 14. FINAL PRE-BUILD CHECK
      # ============================================================
      - run:
          name: Final pre-build verification
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            echo "===== FINAL TOOL CHECK ====="

            python --version
            cython --version
            buildozer --version

            echo "===== JAVA ====="
            java -version

            echo "===== GIT ====="
            git --version

            echo "===== ANDROID SDK ====="
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

            echo "===== BUILD TOOLS ====="

            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            ls -la "$SDK_ROOT/build-tools"

            echo "===== DISK ====="
            df -h

            echo "===== PROJECT TREE ====="

            find . \
              -maxdepth 3 \
              -type f \
              | sort \
              | head -200

            echo "PRE-BUILD VALIDATION PASSED"


      # ============================================================
      # 15. CLEAN OLD BUILD
      # ============================================================
      - run:
          name: Clean old Android build
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            rm -rf bin

            echo "Old APK output removed."


      # ============================================================
      # 16. BUILD APK
      # ============================================================
      - run:
          name: Build Android APK
          no_output_timeout: 30m
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            echo "===== ACTIVE ENVIRONMENT ====="

            command -v python
            command -v cython
            command -v buildozer

            python --version
            cython --version
            buildozer --version

            echo "===== START BUILD ====="

            buildozer -v android debug


      # ============================================================
      # 17. VERIFY APK
      # ============================================================
      - run:
          name: Verify generated APK
          command: |
            set -eux

            echo "===== BIN DIRECTORY ====="

            if [ ! -d bin ]
            then
              echo "ERROR: bin directory does not exist"
              exit 1
            fi

            find bin \
              -type f \
              -name "*.apk" \
              -print

            APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

            if [ "$APK_COUNT" -lt 1 ]
            then
              echo "ERROR: No APK was generated"
              exit 1
            fi

            echo "===== APK DETAILS ====="

            find bin \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

            echo "APK BUILD SUCCESSFUL"


      # ============================================================
      # 18. SAVE APK
      # ============================================================
      - store_artifacts:
          path: bin
          destination: GothicOCR2-APK


workflows:
  build_android:
    jobs:
      - build_android
