version: 2.1

# ============================================================
# GOTHIC OCR — CIRCLECI ANDROID BUILD
# ============================================================

jobs:

  build_android:

    docker:
      - image: cimg/android:2026.08.1-ndk

    resource_class: large

    working_directory: ~/project

    steps:

      # ======================================================
      # 1. CHECKOUT PROJECT
      # ======================================================

      - checkout


      # ======================================================
      # 2. BASIC ENVIRONMENT
      # ======================================================

      - run:
          name: Check environment
          command: |
            set -eux

            echo "=============================================="
            echo "GOTHIC OCR — ENVIRONMENT"
            echo "=============================================="

            echo "User:"
            whoami

            echo ""
            echo "Current directory:"
            pwd

            echo ""
            echo "Python:"
            python3 --version

            echo ""
            echo "Java:"
            java -version

            echo ""
            echo "Javac:"
            javac -version

            echo ""
            echo "Android SDK:"
            echo "${ANDROID_HOME:-not-set}"

            echo ""
            echo "Android SDK root:"
            echo "${ANDROID_SDK_ROOT:-not-set}"

            echo ""
            echo "NDK:"
            ls -la "${ANDROID_HOME:-$HOME/android-sdk}/ndk" 2>/dev/null || true

            echo ""
            echo "=============================================="
            echo "ENVIRONMENT CHECK COMPLETED"
            echo "=============================================="


      # ======================================================
      # 3. SYSTEM DEPENDENCIES
      # ======================================================

      - run:
          name: Install system dependencies
          command: |
            set -eux

            sudo apt-get update

            sudo apt-get install -y \
              git \
              curl \
              wget \
              unzip \
              zip \
              rsync \
              build-essential \
              autoconf \
              automake \
              autopoint \
              libtool \
              pkg-config \
              cmake \
              libffi-dev \
              libssl-dev \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libtinfo6 \
              gettext \
              libltdl-dev \
              ccache

            echo ""
            echo "System dependencies installed."


      # ======================================================
      # 4. FORCE JAVA 17 FOR MODERN ANDROID BUILD
      # ======================================================

      - run:
          name: Configure Java 17
          command: |
            set -eux

            JAVA17="/usr/lib/jvm/java-17-openjdk-amd64"

            if [ ! -d "$JAVA17" ]; then
              echo "ERROR: Java 17 was not found."
              exit 1
            fi

            echo "JAVA_HOME=$JAVA17" >> "$BASH_ENV"

            echo 'export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"' >> "$BASH_ENV"
            echo 'export PATH="$JAVA_HOME/bin:$PATH"' >> "$BASH_ENV"

            source "$BASH_ENV"

            echo "=============================================="
            echo "JAVA CONFIGURATION"
            echo "=============================================="

            echo "JAVA_HOME:"
            echo "$JAVA_HOME"

            echo ""
            java -version

            echo ""
            javac -version

            echo "=============================================="
            echo "JAVA 17 READY"
            echo "=============================================="


      # ======================================================
      # 5. CREATE PYTHON VIRTUAL ENVIRONMENT
      # ======================================================

      - run:
          name: Create Buildozer virtual environment
          command: |
            set -eux

            python3 -m venv ~/buildozer-venv

            source ~/buildozer-venv/bin/activate

            python --version
            pip --version

            python -m pip install --upgrade \
              pip \
              setuptools \
              wheel


      # ======================================================
      # 6. INSTALL BUILD TOOLS
      # ======================================================

      - run:
          name: Install Buildozer Cython Pytest NumPy and Pillow
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            echo "=============================================="
            echo "INSTALLING PYTHON BUILD DEPENDENCIES"
            echo "=============================================="

            python -m pip install \
              "Cython>=3.0,<4" \
              pytest \
              numpy \
              pillow

            python -m pip install \
              git+https://github.com/kivy/buildozer.git

            echo ""
            echo "=============================================="
            echo "INSTALLED PACKAGES"
            echo "=============================================="

            python -m pip show Cython
            python -m pip show pytest
            python -m pip show numpy
            python -m pip show Pillow
            python -m pip show buildozer


      # ======================================================
      # 7. VERIFY PYTHON DEPENDENCIES
      # ======================================================

      - run:
          name: Verify Python dependencies
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            python - <<'PY'
            import sys
            import numpy
            from PIL import Image
            import pytest

            print("Python:", sys.version)
            print("NumPy:", numpy.__version__)
            print("Pillow:", Image.__module__)
            print("Pytest:", pytest.__version__)

            print("Python dependencies are ready.")
            PY


      # ======================================================
      # 8. VERIFY PROJECT STRUCTURE
      # ======================================================

      - run:
          name: Verify project structure
          command: |
            set -eux

            cd ~/project

            echo "=============================================="
            echo "PROJECT STRUCTURE"
            echo "=============================================="

            ls -la

            echo ""
            echo "Services:"
            ls -la services

            echo ""
            echo "Tests:"
            ls -la tests

            echo ""
            echo "Models:"
            ls -la models

            echo ""
            echo "Data:"
            ls -la data

            echo ""
            echo "Fonts:"
            ls -la fonts

            echo ""
            echo "=============================================="
            echo "CHECKING REQUIRED FILES"
            echo "=============================================="

            test -f main.py
            test -f buildozer.spec

            test -f services/__init__.py
            test -f services/image_service.py
            test -f services/model_service.py
            test -f services/text_decoder.py
            test -f services/cache_service.py

            test -f tests/test_decoder.py
            test -f tests/test_image_service.py

            test -f models/gothic_ocr.tflite
            test -f data/labels.json

            echo ""
            echo "All required project files exist."


      # ======================================================
      # 9. VERIFY IMAGE SERVICE IMPORT
      # ======================================================

      - run:
          name: Verify ImageService
          command: |
            set -eux

            cd ~/project

            source ~/buildozer-venv/bin/activate

            python - <<'PY'
            from services.image_service import ImageService

            service = ImageService()

            print("ImageService import is ready.")
            print("Target size:", service.target_size)
            print("Fill:", service.fill)
            PY


      # ======================================================
      # 10. VERIFY TEXT DECODER
      # ======================================================

      - run:
          name: Verify TextDecoder
          command: |
            set -eux

            cd ~/project

            source ~/buildozer-venv/bin/activate

            python - <<'PY'
            from services.text_decoder import TextDecoder

            decoder = TextDecoder()

            print("TextDecoder import is ready.")
            print("Decoder:", decoder)
            PY


      # ======================================================
      # 11. VERIFY MODEL SERVICE
      # ======================================================

      - run:
          name: Verify ModelService
          command: |
            set -eux

            cd ~/project

            source ~/buildozer-venv/bin/activate

            python - <<'PY'
            from services.model_service import GothicOCR

            print("ModelService import is ready.")
            print("Class:", GothicOCR)
            PY


      # ======================================================
      # 12. VERIFY LABELS
      # ======================================================

      - run:
          name: Verify model labels
          command: |
            set -eux

            cd ~/project

            source ~/buildozer-venv/bin/activate

            python - <<'PY'
            import json

            with open(
                "data/labels.json",
                "r",
                encoding="utf-8",
            ) as file:
                labels = json.load(file)

            print("Number of labels:", len(labels))

            if len(labels) != 25:
                raise RuntimeError(
                    f"Expected 25 labels, got {len(labels)}"
                )

            for index, label in enumerate(labels):
                if not isinstance(label, str) or not label:
                    raise RuntimeError(
                        f"Invalid label at index {index}: {label!r}"
                    )

            print("Labels are valid.")
            PY


      # ======================================================
      # 13. VERIFY TFLITE MODEL
      # ======================================================

      - run:
          name: Verify TFLite model
          command: |
            set -eux

            cd ~/project

            test -s models/gothic_ocr.tflite

            echo "Model exists:"
            ls -lh models/gothic_ocr.tflite

            python - <<'PY'
            from pathlib import Path

            model = Path("models/gothic_ocr.tflite")

            size = model.stat().st_size

            print("Model size:", size, "bytes")

            if size <= 0:
                raise RuntimeError(
                    "TFLite model is empty."
                )

            print("TFLite model file is valid.")
            PY


      # ======================================================
      # 14. VERIFY ANDROID SDK
      # ======================================================

      - run:
          name: Prepare Android SDK
          command: |
            set -eux

            source "$BASH_ENV"

            SDK="${ANDROID_HOME:-$HOME/android-sdk}"

            if [ ! -d "$SDK" ]; then
              echo "ERROR: Android SDK directory not found:"
              echo "$SDK"
              exit 1
            fi

            echo "ANDROID_HOME=$SDK"

            mkdir -p "$SDK/cmdline-tools"

            echo ""
            echo "Searching for modern sdkmanager..."

            MODERN_SDKMANAGER=""

            if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
              MODERN_SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            fi

            if [ -z "$MODERN_SDKMANAGER" ]; then
              for candidate in \
                "$SDK/cmdline-tools"/*/bin/sdkmanager
              do
                if [ -x "$candidate" ]; then
                  MODERN_SDKMANAGER="$candidate"
                  break
                fi
              done
            fi

            if [ -z "$MODERN_SDKMANAGER" ]; then
              echo "Modern sdkmanager not found."
              echo "Downloading Android command-line tools..."

              TMP_DIR="/tmp/android-cmdline-tools"

              rm -rf "$TMP_DIR"

              mkdir -p "$TMP_DIR"

              cd "$TMP_DIR"

              curl -fL \
                -o commandlinetools.zip \
                https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

              unzip -q commandlinetools.zip

              rm -rf "$SDK/cmdline-tools/latest"

              mkdir -p "$SDK/cmdline-tools"

              mv \
                cmdline-tools \
                "$SDK/cmdline-tools/latest"

              MODERN_SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            fi

            chmod +x "$MODERN_SDKMANAGER"

            echo ""
            echo "Modern sdkmanager:"
            echo "$MODERN_SDKMANAGER"

            # ------------------------------------------------
            # Buildozer expects:
            #
            # android-sdk/tools/bin/sdkmanager
            #
            # Old Buildozer versions may otherwise execute
            # an obsolete SDK manager which fails with:
            #
            # javax/xml/bind/annotation/XmlSchema
            #
            # We point that legacy path to the modern SDK
            # manager instead.
            # ------------------------------------------------

            mkdir -p "$SDK/tools/bin"

            ln -sfn \
              "$MODERN_SDKMANAGER" \
              "$SDK/tools/bin/sdkmanager"

            if [ -x "$SDK/cmdline-tools/latest/bin/avdmanager" ]; then
              ln -sfn \
                "$SDK/cmdline-tools/latest/bin/avdmanager" \
                "$SDK/tools/bin/avdmanager"
            fi

            export ANDROID_HOME="$SDK"
            export ANDROID_SDK_ROOT="$SDK"

            export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

            echo "export ANDROID_HOME=\"$SDK\"" >> "$BASH_ENV"
            echo "export ANDROID_SDK_ROOT=\"$SDK\"" >> "$BASH_ENV"
            echo "export PATH=\"$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:\$PATH\"" >> "$BASH_ENV"

            echo ""
            echo "=============================================="
            echo "SDKMANAGER TEST"
            echo "=============================================="

            "$MODERN_SDKMANAGER" --version

            echo ""
            echo "=============================================="
            echo "SDK PREPARATION COMPLETED"
            echo "=============================================="


      # ======================================================
      # 15. ACCEPT ANDROID LICENSES
      # ======================================================

      - run:
          name: Accept Android licenses
          command: |
            set -eux

            source "$BASH_ENV"

            SDK="$ANDROID_HOME"

            export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
            export PATH="$JAVA_HOME/bin:$PATH"

            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

            echo "Using sdkmanager:"
            echo "$SDKMANAGER"

            yes | "$SDKMANAGER" --licenses \
              >/tmp/android-licenses.log 2>&1 || true

            tail -50 /tmp/android-licenses.log || true

            echo ""
            echo "Android licenses step completed."


      # ======================================================
      # 16. INSTALL REQUIRED ANDROID SDK COMPONENTS
      # ======================================================

      - run:
          name: Install Android SDK packages
          command: |
            set -eux

            source "$BASH_ENV"

            SDK="$ANDROID_HOME"

            export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
            export PATH="$JAVA_HOME/bin:$PATH"

            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

            echo "=============================================="
            echo "INSTALLING ANDROID SDK COMPONENTS"
            echo "=============================================="

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"

            echo ""
            echo "Installed Android SDK packages."

            echo ""
            echo "Checking API 35:"
            test -d "$SDK/platforms/android-35"

            echo ""
            echo "Checking Build Tools 35:"
            test -d "$SDK/build-tools/35.0.0"

            echo ""
            echo "Checking platform-tools:"
            test -d "$SDK/platform-tools"

            echo ""
            echo "Android SDK packages are ready."


      # ======================================================
      # 17. VERIFY NDK 28c
      # ======================================================

      - run:
          name: Verify Android NDK 28c
          command: |
            set -eux

            source "$BASH_ENV"

            SDK="$ANDROID_HOME"

            echo "=============================================="
            echo "VERIFYING NDK 28c"
            echo "=============================================="

            NDK_DIR="$SDK/ndk/28.2.13676358"

            if [ ! -d "$NDK_DIR" ]; then
              echo "Expected NDK directory not found:"
              echo "$NDK_DIR"

              echo ""
              echo "Available NDK versions:"
              ls -la "$SDK/ndk" 2>/dev/null || true

              exit 1
            fi

            echo "NDK directory:"
            echo "$NDK_DIR"

            echo ""
            echo "NDK version file:"
            cat "$NDK_DIR/source.properties" || true

            echo ""
            echo "NDK 28c is available."


      # ======================================================
      # 18. VERIFY AIDL
      # ======================================================

      - run:
          name: Verify Android AIDL
          command: |
            set -eux

            source "$BASH_ENV"

            AIDL="$ANDROID_HOME/build-tools/35.0.0/aidl"

            echo "AIDL:"
            echo "$AIDL"

            test -x "$AIDL"

            "$AIDL" --version

            echo ""
            echo "AIDL is ready."


      # ======================================================
      # 19. VERIFY JAVA 17 AGAIN
      # ======================================================

      - run:
          name: Verify Java 17 before Buildozer
          command: |
            set -eux

            source "$BASH_ENV"

            export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
            export PATH="$JAVA_HOME/bin:$PATH"

            echo "JAVA_HOME=$JAVA_HOME"

            java -version
            javac -version

            echo ""
            echo "Java 17 is active."


      # ======================================================
      # 20. PYTHON SYNTAX CHECK
      # ======================================================

      - run:
          name: Validate Python syntax
          command: |
            set -eux

            cd ~/project

            source ~/buildozer-venv/bin/activate

            export PYTHONPATH="$HOME/project:${PYTHONPATH:-}"

            python -m compileall -q \
              main.py \
              services \
              tests

            echo ""
            echo "Python syntax validation successful."


      # ======================================================
      # 21. RUN PYTHON TESTS
      # ======================================================

      - run:
          name: Run Python tests
          command: |
            set -eux

            cd ~/project

            source ~/buildozer-venv/bin/activate

            export PYTHONPATH="$HOME/project:${PYTHONPATH:-}"

            echo "=============================================="
            echo "TEST DIRECTORY"
            echo "=============================================="

            find tests \
              -maxdepth 1 \
              -type f \
              -name "test_*.py" \
              -print \
              | sort

            TEST_COUNT="$(
              find tests \
                -maxdepth 1 \
                -type f \
                -name "test_*.py" \
                | wc -l
            )"

            echo ""
            echo "Test files found: $TEST_COUNT"

            if [ "$TEST_COUNT" -eq 0 ]; then
              echo "ERROR: No pytest test files were found."
              exit 1
            fi

            echo ""
            echo "=============================================="
            echo "RUNNING PYTEST"
            echo "=============================================="

            python -m pytest \
              -q \
              tests/test_decoder.py \
              tests/test_image_service.py

            echo ""
            echo "=============================================="
            echo "ALL PYTHON TESTS PASSED"
            echo "=============================================="


      # ======================================================
      # 22. VERIFY BUILDOZER SPEC
      # ======================================================

      - run:
          name: Verify buildozer.spec
          command: |
            set -eux

            cd ~/project

            echo "=============================================="
            echo "BUILDOZER SPEC"
            echo "=============================================="

            cat buildozer.spec

            echo ""
            echo "=============================================="
            echo "CHECKING REQUIRED SETTINGS"
            echo "=============================================="

            grep -q "^android.api = 35" buildozer.spec
            grep -q "^android.minapi = 24" buildozer.spec
            grep -q "^android.archs = arm64-v8a" buildozer.spec
            grep -q "^android.ndk = 28c" buildozer.spec

            grep -q \
              "org.tensorflow:tensorflow-lite:2.17.0" \
              buildozer.spec

            echo ""
            echo "buildozer.spec validation successful."


      # ======================================================
      # 23. CONFIGURE BUILDOZER SDK PATH
      # ======================================================

      - run:
          name: Configure Buildozer Android SDK
          command: |
            set -eux

            cd ~/project

            source "$BASH_ENV"

            SDK="$ANDROID_HOME"

            mkdir -p \
              "$HOME/.buildozer/android/platform"

            # ------------------------------------------------
            # Tell Buildozer to use CircleCI's prepared SDK.
            #
            # This prevents Buildozer from downloading an
            # obsolete SDK manager again.
            # ------------------------------------------------

            if grep -q "^android.sdk_path" buildozer.spec; then

              sed -i \
                "s|^android.sdk_path.*|android.sdk_path = $SDK|" \
                buildozer.spec

            else

              sed -i \
                "/^android.minapi/a android.sdk_path = $SDK" \
                buildozer.spec

            fi

            echo ""
            echo "Configured Android SDK path:"
            grep "^android.sdk_path" buildozer.spec

            # ------------------------------------------------
            # Configure NDK path explicitly.
            # ------------------------------------------------

            NDK_DIR="$SDK/ndk/28.2.13676358"

            if grep -q "^android.ndk_path" buildozer.spec; then

              sed -i \
                "s|^android.ndk_path.*|android.ndk_path = $NDK_DIR|" \
                buildozer.spec

            else

              sed -i \
                "/^android.ndk =/a android.ndk_path = $NDK_DIR" \
                buildozer.spec

            fi

            echo ""
            echo "Configured NDK path:"
            grep "^android.ndk_path" buildozer.spec


      # ======================================================
      # 24. VERIFY BUILDOZER SDK MANAGER PATH
      # ======================================================

      - run:
          name: Verify Buildozer SDK manager
          command: |
            set -eux

            cd ~/project

            source "$BASH_ENV"

            SDK="$ANDROID_HOME"

            SDKMANAGER="$SDK/tools/bin/sdkmanager"

            echo "Buildozer sdkmanager:"
            echo "$SDKMANAGER"

            test -e "$SDKMANAGER"

            echo ""
            echo "sdkmanager target:"
            readlink -f "$SDKMANAGER" || true

            echo ""
            echo "sdkmanager version:"
            "$SDKMANAGER" --version

            echo ""
            echo "Buildozer SDK manager is ready."


      # ======================================================
      # 25. CLEAN OLD BUILDOZER OUTPUT
      # ======================================================

      - run:
          name: Clean old Buildozer output
          command: |
            set -eux

            cd ~/project

            source ~/buildozer-venv/bin/activate

            export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
            export PATH="$JAVA_HOME/bin:$PATH"

            buildozer android clean || true

            rm -rf bin

            echo ""
            echo "Old Buildozer output cleaned."


      # ======================================================
      # 26. FINAL PREBUILD CHECK
      # ======================================================

      - run:
          name: Final pre-build validation
          command: |
            set -eux

            cd ~/project

            source ~/buildozer-venv/bin/activate

            export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
            export PATH="$JAVA_HOME/bin:$PATH"

            echo "=============================================="
            echo "FINAL PRE-BUILD CHECK"
            echo "=============================================="

            echo ""
            echo "Java:"
            java -version

            echo ""
            echo "Python:"
            python --version

            echo ""
            echo "Buildozer:"
            buildozer --version

            echo ""
            echo "Cython:"
            cython --version

            echo ""
            echo "NumPy:"
            python -c "import numpy; print(numpy.__version__)"

            echo ""
            echo "Pillow:"
            python -c "from PIL import Image; print('Pillow OK')"

            echo ""
            echo "Pytest:"
            pytest --version

            echo ""
            echo "Android SDK:"
            echo "$ANDROID_HOME"

            echo ""
            echo "Android API:"
            test -d "$ANDROID_HOME/platforms/android-35"

            echo ""
            echo "Android Build Tools:"
            test -d "$ANDROID_HOME/build-tools/35.0.0"

            echo ""
            echo "Android NDK:"
            test -d "$ANDROID_HOME/ndk/28.2.13676358"

            echo ""
            echo "Model:"
            ls -lh models/gothic_ocr.tflite

            echo ""
            echo "=============================================="
            echo "PRE-BUILD VALIDATION PASSED"
            echo "=============================================="


      # ======================================================
      # 27. BUILD ANDROID APK
      # ======================================================

      - run:
          name: Build Android APK
          no_output_timeout: 30m
          command: |
            set -eux

            cd ~/project

            source ~/buildozer-venv/bin/activate

            # ==================================================
            # JAVA 17 IS USED FOR THE ACTUAL ANDROID BUILD.
            #
            # The obsolete sdkmanager problem has already been
            # solved by redirecting Buildozer's tools/bin path
            # to the modern command-line-tools sdkmanager.
            # ==================================================

            export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
            export PATH="$JAVA_HOME/bin:$PATH"

            export ANDROID_HOME="${ANDROID_HOME}"
            export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

            echo "=============================================="
            echo "BUILDING GOTHIC OCR APK"
            echo "=============================================="

            echo ""
            echo "JAVA_HOME:"
            echo "$JAVA_HOME"

            echo ""
            java -version

            echo ""
            echo "ANDROID_HOME:"
            echo "$ANDROID_HOME"

            echo ""
            echo "NDK:"
            echo "$ANDROID_HOME/ndk/28.2.13676358"

            echo ""
            echo "Starting Buildozer..."

            buildozer -v android debug

            echo ""
            echo "=============================================="
            echo "BUILDOZER BUILD COMMAND FINISHED"
            echo "=============================================="


      # ======================================================
      # 28. VERIFY APK
      # ======================================================

      - run:
          name: Verify APK artifact
          command: |
            set -eux

            cd ~/project

            echo "=============================================="
            echo "APK ARTIFACT CHECK"
            echo "=============================================="

            ls -lah bin || true

            APK_COUNT="$(
              find bin \
                -maxdepth 1 \
                -type f \
                -name "*.apk" \
                | wc -l
            )"

            echo ""
            echo "APK files found: $APK_COUNT"

            if [ "$APK_COUNT" -eq 0 ]; then
              echo ""
              echo "ERROR: No APK was produced."
              echo ""
              echo "Build directory:"
              find bin -maxdepth 2 -type f -print 2>/dev/null || true
              exit 1
            fi

            echo ""
            echo "APK files:"

            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print \
              -exec ls -lh {} \;

            echo ""
            echo "APK artifact verification successful."


      # ======================================================
      # 29. STORE APK
      # ======================================================

      - store_artifacts:
          path: ~/project/bin
          destination: gothicocr-apk


# ============================================================
# WORKFLOW
# ============================================================

workflows:

  build:

    jobs:
      - build_android
