version: 2.1

jobs:
  build_android:

    docker:
      - image: cimg/android:2026.08.1-ndk

    resource_class: large

    working_directory: ~/project

    steps:

      # ============================================================
      # 1. DOWNLOAD PROJECT
      # ============================================================
      - checkout


      # ============================================================
      # 2. CHECK ENVIRONMENT
      # ============================================================
      - run:
          name: Check environment
          command: |
            set -eux

            echo "===== PROJECT ====="
            pwd
            ls -la

            echo "===== PYTHON ====="
            python3 --version

            echo "===== JAVA ====="
            java -version

            echo "===== ANDROID ====="
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

            echo "===== AVAILABLE TOOLS ====="
            command -v sdkmanager || true
            command -v git || true
            command -v python3 || true


      # ============================================================
      # 3. INSTALL SYSTEM DEPENDENCIES
      # ============================================================
      - run:
          name: Install system dependencies
          command: |
            set -eux

            sudo apt-get update

            sudo apt-get install -y \
              git \
              zip \
              unzip \
              openjdk-17-jdk \
              python3 \
              python3-dev \
              python3-pip \
              python3-venv \
              autoconf \
              automake \
              autopoint \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libtinfo6 \
              cmake \
              libffi-dev \
              libssl-dev \
              libbz2-dev \
              liblzma-dev \
              libsqlite3-dev \
              libreadline-dev \
              gettext \
              build-essential

            echo "===== INSTALLED VERSIONS ====="
            java -version
            python3 --version
            git --version


      # ============================================================
      # 4. CREATE BUILD ENVIRONMENT
      # ============================================================
      - run:
          name: Install Buildozer and Cython
          command: |
            set -eux

            rm -rf ~/buildozer-venv

            python3 -m venv ~/buildozer-venv

            source ~/buildozer-venv/bin/activate

            python -m pip install --upgrade \
              pip \
              setuptools \
              wheel

            python -m pip install \
              "Cython==0.29.34" \
              "buildozer==1.6.0"

            echo "===== INSTALLED PACKAGES ====="

            python -m pip show Cython
            python -m pip show buildozer

            echo "===== VERIFY CYTHON ====="
            cython --version

            echo "===== VERIFY BUILDOZER ====="
            buildozer --version


      # ============================================================
      # 5. VALIDATE PROJECT FILES
      # ============================================================
      - run:
          name: Validate project files
          command: |
            set -eux

            echo "===== PROJECT FILES ====="

            test -f main.py
            test -f buildozer.spec

            test -f models/gothic_ocr.tflite
            test -f data/labels.json
            test -f fonts/NotoSansGothic-Regular.ttf

            test -f services/__init__.py
            test -f services/image_service.py
            test -f services/model_service.py
            test -f services/text_decoder.py

            echo "===== FILE SIZES ====="

            ls -lh models/gothic_ocr.tflite
            ls -lh data/labels.json
            ls -lh fonts/NotoSansGothic-Regular.ttf

            echo "All required project files found."


      # ============================================================
      # 6. VALIDATE PYTHON SYNTAX
      # ============================================================
      - run:
          name: Validate Python syntax
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            echo "===== COMPILING MAIN ====="

            python -m py_compile main.py

            echo "===== COMPILING SERVICES ====="

            python -m compileall -q services

            if [ -d tests ]; then
              echo "===== COMPILING TESTS ====="
              python -m compileall -q tests
            fi

            echo "Python syntax validation successful."


      # ============================================================
      # 7. VALIDATE BUILDOZER
      # ============================================================
      - run:
          name: Validate Buildozer
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            echo "===== TOOL PATHS ====="

            command -v python
            command -v cython
            command -v buildozer

            echo "===== TOOL VERSIONS ====="

            python --version
            cython --version
            buildozer --version

            test -f buildozer.spec

            echo "===== BUILDOZER CONFIGURATION ====="

            grep -E \
              '^(title|package.name|package.domain|version|source.dir|requirements|android.api|android.minapi|android.archs|android.ndk|android.gradle_dependencies|p4a.branch)' \
              buildozer.spec || true


      # ============================================================
      # 8. VALIDATE ANDROID SDK
      # ============================================================
      - run:
          name: Validate Android SDK
          command: |
            set -eux

            echo "===== ANDROID ENVIRONMENT ====="

            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

            echo "===== SDKMANAGER ====="

            command -v sdkmanager || true

            if command -v sdkmanager >/dev/null 2>&1; then
              sdkmanager --version
            else
              echo "WARNING: sdkmanager is not directly available in PATH"
            fi

            echo "Android SDK validation completed."


      # ============================================================
      # 9. CLEAN ANDROID ENVIRONMENT + PERMANENT AIDL FIX
      # ============================================================
      - run:
          name: Clean Android environment and fix AIDL
          command: |
            set -eux

            echo "========================================"
            echo "CLEAN OLD BUILDOZER ANDROID ENVIRONMENT"
            echo "========================================"

            rm -rf .buildozer
            rm -rf ~/.buildozer
            rm -rf ~/.gradle/caches
            rm -rf ~/.gradle/daemon

            mkdir -p ~/.gradle

            echo "========================================"
            echo "ANDROID SDK"
            echo "========================================"

            export ANDROID_SDK_ROOT="${ANDROID_HOME}"
            export ANDROIDSDK="${ANDROID_HOME}"

            echo "ANDROID_HOME=${ANDROID_HOME}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

            SDKMANAGER="$(find "${ANDROID_HOME}" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              | head -n 1)"

            if [ -z "${SDKMANAGER}" ]; then
              echo "ERROR: sdkmanager not found"
              find "${ANDROID_HOME}" \
                -type f \
                -name sdkmanager \
                -print || true
              exit 1
            fi

            echo "SDKMANAGER=${SDKMANAGER}"

            echo "========================================"
            echo "SDKMANAGER VERSION"
            echo "========================================"

            "${SDKMANAGER}" --version

            echo "========================================"
            echo "ACCEPT LICENSES"
            echo "========================================"

            yes | "${SDKMANAGER}" \
              --sdk_root="${ANDROID_HOME}" \
              --licenses || true

            echo "========================================"
            echo "UPDATE SDK REPOSITORIES"
            echo "========================================"

            "${SDKMANAGER}" \
              --sdk_root="${ANDROID_HOME}" \
              --update

            echo "========================================"
            echo "INSTALL REQUIRED ANDROID PACKAGES"
            echo "========================================"

            "${SDKMANAGER}" \
              --sdk_root="${ANDROID_HOME}" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              "build-tools;37.0.0"

            echo "========================================"
            echo "VERIFY BUILD TOOLS 37"
            echo "========================================"

            AIDL37="${ANDROID_HOME}/build-tools/37.0.0/aidl"

            if [ ! -f "${AIDL37}" ]; then
              echo "ERROR: AIDL 37.0.0 WAS NOT INSTALLED"

              echo "AVAILABLE BUILD TOOLS:"
              ls -la "${ANDROID_HOME}/build-tools" || true

              echo "SEARCHING FOR AIDL:"
              find "${ANDROID_HOME}" \
                -type f \
                -name aidl \
                -print || true

              exit 1
            fi

            chmod +x "${AIDL37}"

            echo "========================================"
            echo "AIDL LOCATION"
            echo "========================================"

            ls -lh "${AIDL37}"

            "${AIDL37}" --version || true

            echo "========================================"
            echo "CREATE STABLE BUILD TOOLS PATH"
            echo "========================================"

            export PATH="${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/build-tools/37.0.0:${PATH}"

            command -v aidl

            echo "========================================"
            echo "AIDL FINAL TEST"
            echo "========================================"

            aidl --version || true

            echo "========================================"
            echo "ANDROID ENVIRONMENT READY"
            echo "========================================"


      # ============================================================
      # 10. FINAL PRE-BUILD CHECK
      # ============================================================
      - run:
          name: Final pre-build verification
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            echo "===== FINAL TOOL CHECK ====="

            command -v python
            command -v cython
            command -v buildozer

            python --version
            cython --version
            buildozer --version

            echo "===== GIT ====="
            git --version

            echo "===== JAVA ====="
            java -version

            echo "===== DISK ====="
            df -h

            echo "===== MEMORY ====="
            free -h || true

            echo "===== ANDROID SDK ====="
            echo "ANDROID_HOME=${ANDROID_HOME}"

            echo "===== VERIFY AIDL ONE LAST TIME ====="

            test -f "${ANDROID_HOME}/build-tools/37.0.0/aidl"

            echo "AIDL IS AVAILABLE"

            echo "PRE-BUILD VALIDATION PASSED"


      # ============================================================
      # 11. BUILD APK
      # ============================================================
      - run:
          name: Build Android APK
          no_output_timeout: 30m
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            # --------------------------------------------------------
            # FORCE SINGLE ANDROID SDK
            # --------------------------------------------------------

            export ANDROIDSDK="${ANDROID_HOME}"
            export ANDROID_SDK_ROOT="${ANDROID_HOME}"

            export ANDROIDAPI=35
            export ANDROIDMINAPI=23

            export PATH="${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/build-tools/37.0.0:${PATH}"

            echo "===== ACTIVE ENVIRONMENT ====="

            echo "ANDROIDSDK=${ANDROIDSDK}"
            echo "ANDROID_HOME=${ANDROID_HOME}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

            echo "===== TOOL PATHS ====="

            command -v python
            command -v cython
            command -v buildozer
            command -v aidl

            echo "===== TOOL VERSIONS ====="

            python --version
            cython --version
            buildozer --version

            echo "===== VERIFY AIDL BEFORE BUILD ====="

            AIDL_PATH="${ANDROID_HOME}/build-tools/37.0.0/aidl"

            test -f "${AIDL_PATH}"

            chmod +x "${AIDL_PATH}" || true

            ls -lh "${AIDL_PATH}"

            echo "AIDL READY FOR BUILD"

            echo "===== START BUILD ====="

            buildozer android debug


      # ============================================================
      # 12. VERIFY APK
      # ============================================================
      - run:
          name: Verify generated APK
          command: |
            set -eux

            echo "===== BIN DIRECTORY ====="

            if [ ! -d bin ]; then
              echo "ERROR: bin directory does not exist"
              exit 1
            fi

            echo "===== GENERATED FILES ====="

            find bin \
              -maxdepth 2 \
              -type f \
              -print

            echo "===== APK FILES ====="

            find bin \
              -type f \
              -name "*.apk" \
              -print

            APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

            if [ "${APK_COUNT}" -lt 1 ]; then
              echo "ERROR: No APK was generated"
              exit 1
            fi

            echo "===== APK SIZE ====="

            find bin \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

            echo "APK BUILD SUCCESSFUL"


      # ============================================================
      # 13. SAVE APK
      # ============================================================
      - store_artifacts:
          path: bin
          destination: GothicOCR2-APK


workflows:
  build_android:
    jobs:
      - build_android
