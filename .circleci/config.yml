version: 2.1

jobs:
  build_android:

    docker:
      - image: cimg/android:2026.08.1-ndk

    resource_class: large

    working_directory: ~/project

    steps:

      # ============================================================
      # 1. DOWNLOAD PROJECT
      # ============================================================
      - checkout


      # ============================================================
      # 2. CHECK ENVIRONMENT
      # ============================================================
      - run:
          name: Check environment
          command: |
            set -eux

            echo "===== PROJECT ====="
            pwd
            ls -la

            echo "===== PYTHON ====="
            python3 --version

            echo "===== JAVA ====="
            java -version

            echo "===== ANDROID ====="
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

            echo "===== AVAILABLE TOOLS ====="
            command -v sdkmanager || true
            command -v git || true
            command -v python3 || true


      # ============================================================
      # 3. INSTALL SYSTEM DEPENDENCIES
      # ============================================================
      - run:
          name: Install system dependencies
          command: |
            set -eux

            sudo apt-get update

            sudo apt-get install -y \
              git \
              zip \
              unzip \
              openjdk-17-jdk \
              python3 \
              python3-dev \
              python3-pip \
              python3-venv \
              autoconf \
              automake \
              autopoint \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libtinfo6 \
              cmake \
              libffi-dev \
              libssl-dev \
              libbz2-dev \
              liblzma-dev \
              libsqlite3-dev \
              libreadline-dev \
              gettext \
              build-essential \
              ccache

            echo "===== INSTALLED VERSIONS ====="

            java -version
            python3 --version
            git --version

            echo "===== CCACHE ====="
            ccache --version || true


      # ============================================================
      # 4. CONFIGURE BUILD CACHE
      # ============================================================
      - run:
          name: Configure build cache
          command: |
            set -eux

            mkdir -p ~/.buildozer
            mkdir -p ~/.gradle

            ccache -M 2G || true

            echo "Build cache configured."


      # ============================================================
      # 5. CREATE BUILD ENVIRONMENT
      # ============================================================
      - run:
          name: Install Buildozer and Cython
          command: |
            set -eux

            rm -rf ~/buildozer-venv

            python3 -m venv ~/buildozer-venv

            source ~/buildozer-venv/bin/activate

            python -m pip install --upgrade \
              pip \
              setuptools \
              wheel

            python -m pip install \
              "Cython==0.29.34" \
              "buildozer==1.6.0"

            echo "===== INSTALLED PACKAGES ====="

            python -m pip show Cython
            python -m pip show buildozer

            echo "===== VERIFY CYTHON ====="
            cython --version

            echo "===== VERIFY BUILDOZER ====="
            buildozer --version


      # ============================================================
      # 6. VALIDATE PROJECT FILES
      # ============================================================
      - run:
          name: Validate project files
          command: |
            set -eux

            echo "===== PROJECT FILES ====="

            test -f main.py
            test -f buildozer.spec

            test -f models/gothic_ocr.tflite
            test -f data/labels.json
            test -f fonts/NotoSansGothic-Regular.ttf

            test -f services/__init__.py
            test -f services/image_service.py
            test -f services/model_service.py
            test -f services/text_decoder.py

            echo "===== FILE SIZES ====="

            ls -lh models/gothic_ocr.tflite
            ls -lh data/labels.json
            ls -lh fonts/NotoSansGothic-Regular.ttf

            echo "All required project files found."


      # ============================================================
      # 7. VALIDATE PYTHON SYNTAX
      # ============================================================
      - run:
          name: Validate Python syntax
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            echo "===== COMPILING MAIN ====="

            python -m py_compile main.py

            echo "===== COMPILING SERVICES ====="

            python -m compileall -q services

            if [ -d tests ]; then
              echo "===== COMPILING TESTS ====="
              python -m compileall -q tests
            fi

            echo "Python syntax validation successful."


      # ============================================================
      # 8. VALIDATE BUILDOZER
      # ============================================================
      - run:
          name: Validate Buildozer
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            echo "===== TOOL PATHS ====="

            command -v python
            command -v cython
            command -v buildozer

            echo "===== TOOL VERSIONS ====="

            python --version
            cython --version
            buildozer --version

            test -f buildozer.spec

            echo "===== BUILDOZER CONFIGURATION ====="

            grep -E \
              '^(title|package.name|package.domain|version|source.dir|requirements|android.api|android.minapi|android.archs|android.ndk|android.gradle_dependencies|p4a.branch)' \
              buildozer.spec || true


      # ============================================================
      # 9. VALIDATE ANDROID SDK
      # ============================================================
      - run:
          name: Validate Android SDK
          command: |
            set -eux

            echo "===== ANDROID ENVIRONMENT ====="

            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

            echo "===== SDKMANAGER ====="

            command -v sdkmanager || true

            if command -v sdkmanager >/dev/null 2>&1; then
              sdkmanager --version
            else
              echo "WARNING: sdkmanager is not directly available in PATH"
            fi

            echo "Android SDK validation completed."


      # ============================================================
      # 10. INSTALL ANDROID BUILD TOOLS + FIX AIDL
      # ============================================================
      - run:
          name: Install and verify Android Build Tools and AIDL
          command: |
            set -eux

            echo "===== ANDROID SDK SETUP ====="

            export ANDROID_SDK_ROOT="${ANDROID_HOME}"

            echo "ANDROID_HOME=${ANDROID_HOME}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

            # --------------------------------------------------------
            # FIND SDKMANAGER SAFELY
            # --------------------------------------------------------

            SDKMANAGER=""

            if command -v sdkmanager >/dev/null 2>&1; then
              SDKMANAGER="$(command -v sdkmanager)"
            fi

            if [ -z "${SDKMANAGER}" ]; then
              for candidate in \
                "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
                "${ANDROID_HOME}/cmdline-tools/bin/sdkmanager" \
                "${ANDROID_HOME}/tools/bin/sdkmanager"
              do
                if [ -x "${candidate}" ]; then
                  SDKMANAGER="${candidate}"
                  break
                fi
              done
            fi

            if [ -z "${SDKMANAGER}" ]; then
              echo "ERROR: sdkmanager could not be found."
              echo "ANDROID_HOME=${ANDROID_HOME}"

              find "${ANDROID_HOME}" \
                -type f \
                -name sdkmanager \
                -print 2>/dev/null || true

              exit 1
            fi

            echo "SDKMANAGER=${SDKMANAGER}"

            echo "===== SDKMANAGER VERSION ====="

            "${SDKMANAGER}" --version


            # --------------------------------------------------------
            # ACCEPT LICENSES
            # --------------------------------------------------------

            echo "===== ACCEPT ANDROID LICENSES ====="

            yes | "${SDKMANAGER}" \
              --sdk_root="${ANDROID_HOME}" \
              --licenses || true


            # --------------------------------------------------------
            # INSTALL REQUIRED SDK COMPONENTS
            # --------------------------------------------------------

            echo "===== INSTALL PLATFORM TOOLS ====="

            "${SDKMANAGER}" \
              --sdk_root="${ANDROID_HOME}" \
              "platform-tools"


            echo "===== INSTALL ANDROID API 35 ====="

            "${SDKMANAGER}" \
              --sdk_root="${ANDROID_HOME}" \
              "platforms;android-35"


            echo "===== INSTALL BUILD TOOLS 35.0.0 ====="

            "${SDKMANAGER}" \
              --sdk_root="${ANDROID_HOME}" \
              "build-tools;35.0.0"


            # --------------------------------------------------------
            # VERIFY AIDL
            # --------------------------------------------------------

            echo "===== VERIFY AIDL ====="

            AIDL_PATH="${ANDROID_HOME}/build-tools/35.0.0/aidl"

            if [ ! -f "${AIDL_PATH}" ]; then
              echo "ERROR: AIDL was not found."

              echo "===== SEARCHING FOR AIDL ====="

              find "${ANDROID_HOME}" \
                -type f \
                -name aidl \
                -print 2>/dev/null || true

              exit 1
            fi

            chmod +x "${AIDL_PATH}" || true

            echo "AIDL_PATH=${AIDL_PATH}"

            ls -lh "${AIDL_PATH}"

            echo "===== AIDL VERIFIED SUCCESSFULLY ====="


            # --------------------------------------------------------
            # SHOW INSTALLED BUILD TOOLS
            # --------------------------------------------------------

            echo "===== INSTALLED BUILD TOOLS ====="

            ls -la "${ANDROID_HOME}/build-tools" || true

            echo "===== ALL AVAILABLE AIDL FILES ====="

            find "${ANDROID_HOME}/build-tools" \
              -type f \
              -name aidl \
              -print 2>/dev/null || true

            echo "ANDROID BUILD TOOLS AND AIDL READY"


      # ============================================================
      # 11. FINAL PRE-BUILD CHECK
      # ============================================================
      - run:
          name: Final pre-build verification
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            echo "===== FINAL TOOL CHECK ====="

            command -v python
            command -v cython
            command -v buildozer

            python --version
            cython --version
            buildozer --version

            echo "===== GIT ====="

            git --version

            echo "===== JAVA ====="

            java -version

            echo "===== DISK ====="

            df -h

            echo "===== MEMORY ====="

            free -h || true

            echo "===== ANDROID SDK ====="

            echo "ANDROID_HOME=${ANDROID_HOME}"

            echo "===== VERIFY AIDL ONE LAST TIME ====="

            test -f "${ANDROID_HOME}/build-tools/35.0.0/aidl"

            echo "AIDL IS AVAILABLE"

            echo "PRE-BUILD VALIDATION PASSED"


      # ============================================================
      # 12. BUILD APK
      # ============================================================
      - run:
          name: Build Android APK
          no_output_timeout: 30m
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            export USE_CCACHE=1

            # --------------------------------------------------------
            # FORCE ANDROID ENVIRONMENT
            # --------------------------------------------------------

            export ANDROIDSDK="${ANDROID_HOME}"
            export ANDROID_SDK_ROOT="${ANDROID_HOME}"

            export ANDROIDAPI=35
            export ANDROIDMINAPI=23

            export PATH="${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/build-tools/35.0.0:${PATH}"


            echo "===== ACTIVE ENVIRONMENT ====="

            echo "ANDROIDSDK=${ANDROIDSDK}"
            echo "ANDROID_HOME=${ANDROID_HOME}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

            echo "===== TOOL PATHS ====="

            command -v python
            command -v cython
            command -v buildozer
            command -v aidl


            echo "===== TOOL VERSIONS ====="

            python --version
            cython --version
            buildozer --version


            echo "===== VERIFY AIDL BEFORE BUILD ====="

            AIDL_PATH="${ANDROID_HOME}/build-tools/35.0.0/aidl"

            test -f "${AIDL_PATH}"

            chmod +x "${AIDL_PATH}" || true

            ls -lh "${AIDL_PATH}"

            echo "AIDL READY FOR BUILD"


            echo "===== START BUILD ====="

            buildozer android debug


      # ============================================================
      # 13. VERIFY APK
      # ============================================================
      - run:
          name: Verify generated APK
          command: |
            set -eux

            echo "===== BIN DIRECTORY ====="

            if [ ! -d bin ]; then
              echo "ERROR: bin directory does not exist"
              exit 1
            fi

            echo "===== GENERATED FILES ====="

            find bin \
              -maxdepth 2 \
              -type f \
              -print


            echo "===== APK FILES ====="

            find bin \
              -type f \
              -name "*.apk" \
              -print


            APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

            if [ "${APK_COUNT}" -lt 1 ]; then
              echo "ERROR: No APK was generated"
              exit 1
            fi


            echo "===== APK SIZE ====="

            find bin \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;


            echo "APK BUILD SUCCESSFUL"


      # ============================================================
      # 14. SAVE APK
      # ============================================================
      - store_artifacts:
          path: bin
          destination: GothicOCR2-APK


workflows:
  build_android:
    jobs:
      - build_android
