version: 2.1

jobs:
  build_android:
    docker:
      - image: cimg/android:2026.08.1-ndk

    resource_class: large

    working_directory: ~/project

    steps:

      # ============================================================
      # 1. DOWNLOAD PROJECT
      # ============================================================
      - checkout


      # ============================================================
      # 2. CHECK ENVIRONMENT
      # ============================================================
      - run:
          name: Check environment
          command: |
            set -eux

            echo "===== PROJECT ====="
            pwd
            ls -la

            echo "===== PYTHON ====="
            python3 --version

            echo "===== JAVA ====="
            java -version

            echo "===== ANDROID ====="
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

            command -v sdkmanager
            command -v git


      # ============================================================
      # 3. INSTALL SYSTEM DEPENDENCIES
      # ============================================================
      - run:
          name: Install system dependencies
          command: |
            set -eux

            sudo apt-get update

            sudo apt-get install -y \
              git \
              zip \
              unzip \
              openjdk-17-jdk \
              python3 \
              python3-dev \
              python3-pip \
              python3-venv \
              autoconf \
              automake \
              autopoint \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libtinfo6 \
              cmake \
              libffi-dev \
              libssl-dev \
              gettext \
              build-essential \
              ccache \
              patch \
              wget

            echo "===== JAVA 17 ====="
            /usr/lib/jvm/java-17-openjdk-amd64/bin/java -version

            echo "===== PYTHON ====="
            python3 --version


      # ============================================================
      # 4. CREATE PYTHON BUILD ENVIRONMENT
      # ============================================================
      - run:
          name: Install Buildozer and Cython
          command: |
            set -eux

            rm -rf ~/buildozer-venv

            python3 -m venv ~/buildozer-venv

            source ~/buildozer-venv/bin/activate

            python -m pip install --upgrade \
              pip \
              setuptools \
              wheel

            python -m pip install \
              "Cython==0.29.34" \
              "buildozer==1.6.0"

            echo "===== INSTALLED PACKAGES ====="

            python -m pip show Cython
            python -m pip show buildozer

            cython --version
            buildozer --version


      # ============================================================
      # 5. VALIDATE PROJECT FILES
      # ============================================================
      - run:
          name: Validate project files
          command: |
            set -eux

            test -f main.py
            test -f buildozer.spec

            test -f models/gothic_ocr.tflite
            test -f data/labels.json
            test -f fonts/NotoSansGothic-Regular.ttf

            test -f services/__init__.py
            test -f services/image_service.py
            test -f services/model_service.py
            test -f services/text_decoder.py

            test -f java/org/gothicocr/TFLiteBridge.java

            echo "All required project files found."


      # ============================================================
      # 6. VALIDATE PYTHON SYNTAX
      # ============================================================
      - run:
          name: Validate Python syntax
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            python -m compileall -q \
              main.py \
              services \
              tests

            echo "Python syntax validation successful."


      # ============================================================
      # 7. VALIDATE BUILDOZER CONFIGURATION
      # ============================================================
      - run:
          name: Validate Buildozer configuration
          command: |
            set -eux

            grep -F \
              "android.ndk = 28c" \
              buildozer.spec

            grep -F \
              "org.tensorflow:tensorflow-lite:2.17.0" \
              buildozer.spec

            grep -E \
              '^android.add_src[[:space:]]*=[[:space:]]*java' \
              buildozer.spec

            grep -F \
              "class TFLiteBridge" \
              java/org/gothicocr/TFLiteBridge.java

            echo "Buildozer configuration validated."


      # ============================================================
      # 8. CONFIGURE JAVA 17
      # ============================================================
      - run:
          name: Configure Java 17
          command: |
            set -eux

            echo 'export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64' >> "$BASH_ENV"
            echo 'export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH' >> "$BASH_ENV"

            source "$BASH_ENV"

            echo "JAVA_HOME=$JAVA_HOME"

            java -version
            javac -version


      # ============================================================
      # 9. CONFIGURE ANDROID SDK AND NDK
      # ============================================================
      - run:
          name: Configure Android SDK and NDK
          command: |
            set -eux

            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/home/circleci/android-sdk}}"

            NDK_ROOT="/home/circleci/android-sdk/ndk/28.2.13676358"

            test -d "$SDK_ROOT"
            test -d "$NDK_ROOT"

            echo "export ANDROID_HOME=$SDK_ROOT" >> "$BASH_ENV"
            echo "export ANDROID_SDK_ROOT=$SDK_ROOT" >> "$BASH_ENV"

            echo "export ANDROIDSDK=$SDK_ROOT" >> "$BASH_ENV"
            echo "export ANDROIDNDK=$NDK_ROOT" >> "$BASH_ENV"

            echo "export ANDROIDAPI=35" >> "$BASH_ENV"
            echo "export NDKAPI=23" >> "$BASH_ENV"

            source "$BASH_ENV"

            echo "ANDROIDSDK=$ANDROIDSDK"
            echo "ANDROIDNDK=$ANDROIDNDK"

            ls -la "$ANDROIDSDK"
            ls -la "$ANDROIDNDK" | head


      # ============================================================
      # 10. ACCEPT ANDROID LICENSES
      # ============================================================
      - run:
          name: Accept Android SDK licenses
          command: |
            set -eux

            source "$BASH_ENV"

            echo "===== ACCEPTING ANDROID LICENSES ====="

            set +e
            yes | sdkmanager --licenses >/dev/null 2>&1
            SDKMANAGER_STATUS=${PIPESTATUS[1]}
            set -e

            if [ "$SDKMANAGER_STATUS" -ne 0 ]
            then
              echo "WARNING: License command returned status $SDKMANAGER_STATUS"
            fi

            echo "Android SDK license step completed."


      # ============================================================
      # 11. INSTALL REQUIRED ANDROID SDK PACKAGES
      # ============================================================
      - run:
          name: Install Android SDK packages
          command: |
            set -eux

            source "$BASH_ENV"

            echo "=== Installing Android SDK packages ==="

            sdkmanager \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"

            echo "=== Android SDK setup completed ==="

            echo "===== INSTALLED SDK COMPONENTS ====="

            test -d "$ANDROIDSDK/platform-tools"
            test -d "$ANDROIDSDK/platforms/android-35"
            test -d "$ANDROIDSDK/build-tools/35.0.0"

            echo "===== SDK PACKAGES VERIFIED ====="

            sdkmanager --list_installed 2>/dev/null | grep -E \
              "platform-tools|platforms;android-35|build-tools;35.0.0" || true


      # ============================================================
      # 12. VERIFY AIDL
      # ============================================================
      - run:
          name: Verify AIDL
          command: |
            set -eux

            source "$BASH_ENV"

            AIDL="$ANDROIDSDK/build-tools/35.0.0/aidl"

            if [ ! -f "$AIDL" ]
            then
              echo "ERROR: AIDL not found at:"
              echo "$AIDL"
              exit 1
            fi

            echo "AIDL found:"
            echo "$AIDL"


      # ============================================================
      # 13. PREPARE BUILDOZER SDK/NDK PATHS
      # ============================================================
      - run:
          name: Configure Buildozer Android paths
          command: |
            set -eux

            source "$BASH_ENV"

            mkdir -p ~/.buildozer/android/platform

            rm -rf ~/.buildozer/android/platform/android-sdk
            rm -rf ~/.buildozer/android/platform/android-ndk-r28c

            ln -s \
              "$ANDROIDSDK" \
              ~/.buildozer/android/platform/android-sdk

            ln -s \
              "$ANDROIDNDK" \
              ~/.buildozer/android/platform/android-ndk-r28c

            echo "===== BUILDOZER ANDROID LINKS ====="

            ls -la ~/.buildozer/android/platform

            echo "===== SDK BUILD TOOLS ====="

            ls -la \
              ~/.buildozer/android/platform/android-sdk/build-tools/35.0.0

            echo "===== AIDL ====="

            test -f \
              ~/.buildozer/android/platform/android-sdk/build-tools/35.0.0/aidl


      # ============================================================
      # 14. VALIDATE MODEL
      # ============================================================
      - run:
          name: Validate model file
          command: |
            set -eux

            ls -lh models/gothic_ocr.tflite

            MODEL_SIZE=$(stat -c%s models/gothic_ocr.tflite)

            if [ "$MODEL_SIZE" -lt 1000 ]
            then
              echo "ERROR: TFLite model is empty or invalid."
              exit 1
            fi

            echo "Model validation successful."


      # ============================================================
      # 15. FINAL PRE-BUILD CHECK
      # ============================================================
      - run:
          name: Final pre-build verification
          command: |
            set -eux

            source "$BASH_ENV"
            source ~/buildozer-venv/bin/activate

            echo "===== PYTHON ====="
            python --version

            echo "===== CYTHON ====="
            cython --version

            echo "===== BUILDOZER ====="
            buildozer --version

            echo "===== JAVA ====="
            java -version
            javac -version

            echo "===== SDK ====="
            echo "$ANDROIDSDK"

            echo "===== NDK ====="
            echo "$ANDROIDNDK"

            echo "===== AIDL ====="
            test -f \
              "$ANDROIDSDK/build-tools/35.0.0/aidl"

            echo "===== DISK ====="
            df -h

            echo "PRE-BUILD VALIDATION PASSED"


      # ============================================================
      # 16. CLEAN OUTPUT
      # ============================================================
      - run:
          name: Clean old output
          command: |
            set -eux

            rm -rf bin

            echo "Old output removed."


      # ============================================================
      # 17. BUILD APK
      # ============================================================
      - run:
          name: Build Android APK
          no_output_timeout: 30m
          command: |
            set -eux

            source "$BASH_ENV"
            source ~/buildozer-venv/bin/activate

            echo "===== ACTIVE BUILD ENVIRONMENT ====="

            echo "JAVA_HOME=$JAVA_HOME"
            echo "ANDROIDSDK=$ANDROIDSDK"
            echo "ANDROIDNDK=$ANDROIDNDK"
            echo "ANDROIDAPI=$ANDROIDAPI"
            echo "NDKAPI=$NDKAPI"

            java -version
            javac -version
            python --version
            cython --version
            buildozer --version

            echo "===== START BUILD ====="

            buildozer -v android debug


      # ============================================================
      # 18. VERIFY APK
      # ============================================================
      - run:
          name: Verify generated APK
          command: |
            set -eux

            if [ ! -d bin ]
            then
              echo "ERROR: bin directory does not exist."
              exit 1
            fi

            echo "===== APK FILES ====="

            find bin \
              -type f \
              -name "*.apk" \
              -print

            APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

            if [ "$APK_COUNT" -lt 1 ]
            then
              echo "ERROR: No APK generated."
              exit 1
            fi

            echo "===== APK DETAILS ====="

            find bin \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

            echo "APK BUILD SUCCESSFUL"


      # ============================================================
      # 19. SAVE APK
      # ============================================================
      - store_artifacts:
          path: bin
          destination: GothicOCR2-APK


workflows:
  build_android:
    jobs:
      - build_android
