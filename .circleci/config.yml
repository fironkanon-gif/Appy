version: 2.1

jobs:
  build_android:
    docker:
      - image: cimg/android:2026.08.1-ndk

    resource_class: large

    working_directory: ~/project

    steps:

      # ============================================================
      # 1. DOWNLOAD PROJECT
      # ============================================================
      - checkout


      # ============================================================
      # 2. CHECK ENVIRONMENT
      # ============================================================
      - run:
          name: Check environment
          command: |
            set -eux

            echo "=========================================="
            echo "        GOTHIC OCR ANDROID BUILD"
            echo "=========================================="

            echo "===== PROJECT ====="
            pwd
            ls -la

            echo "===== PYTHON ====="
            python3 --version

            echo "===== JAVA ====="
            java -version

            echo "===== ANDROID ====="
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

            command -v sdkmanager
            command -v git


      # ============================================================
      # 3. INSTALL SYSTEM DEPENDENCIES
      # ============================================================
      - run:
          name: Install system dependencies
          command: |
            set -eux

            sudo apt-get update

            sudo apt-get install -y \
              git \
              zip \
              unzip \
              openjdk-17-jdk \
              python3 \
              python3-dev \
              python3-pip \
              python3-venv \
              autoconf \
              automake \
              autopoint \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libtinfo6 \
              cmake \
              libffi-dev \
              libssl-dev \
              gettext \
              build-essential \
              ccache \
              patch \
              wget \
              curl \
              tar

            echo "===== JAVA 17 ====="
            /usr/lib/jvm/java-17-openjdk-amd64/bin/java -version

            echo "===== PYTHON ====="
            python3 --version


      # ============================================================
      # 4. CREATE PYTHON BUILD ENVIRONMENT
      # ============================================================
      - run:
          name: Install Buildozer and Cython
          command: |
            set -eux

            rm -rf ~/buildozer-venv

            python3 -m venv ~/buildozer-venv

            source ~/buildozer-venv/bin/activate

            python -m pip install --upgrade \
              pip \
              setuptools \
              wheel

            python -m pip install \
              "Cython==0.29.34" \
              "buildozer==1.6.0"

            echo "===== INSTALLED PACKAGES ====="

            python -m pip show Cython
            python -m pip show buildozer

            cython --version
            buildozer --version


      # ============================================================
      # 5. VALIDATE PROJECT FILES
      # ============================================================
      - run:
          name: Validate Gothic OCR project files
          command: |
            set -eux

            echo "===== CHECKING REQUIRED FILES ====="

            test -f main.py
            test -f buildozer.spec

            test -f models/gothic_ocr.tflite
            test -f data/labels.json
            test -f fonts/NotoSansGothic-Regular.ttf

            test -f services/__init__.py
            test -f services/image_service.py
            test -f services/model_service.py
            test -f services/text_decoder.py

            test -f java/org/gothicocr/TFLiteBridge.java

            echo "=========================================="
            echo "ALL GOTHIC OCR FILES FOUND"
            echo "=========================================="


      # ============================================================
      # 6. VALIDATE PYTHON SYNTAX
      # ============================================================
      - run:
          name: Validate Python syntax
          command: |
            set -eux

            source ~/buildozer-venv/bin/activate

            python -m compileall -q \
              main.py \
              services \
              tests

            echo "Python syntax validation successful."


      # ============================================================
      # 7. VALIDATE BUILDOZER CONFIGURATION
      # ============================================================
      - run:
          name: Validate Buildozer configuration
          command: |
            set -eux

            echo "===== CHECKING NDK ====="

            grep -F \
              "android.ndk = 28c" \
              buildozer.spec

            echo "===== CHECKING TENSORFLOW LITE ====="

            grep -F \
              "org.tensorflow:tensorflow-lite:2.17.0" \
              buildozer.spec

            echo "===== CHECKING JAVA SOURCE ====="

            grep -E \
              '^android.add_src[[:space:]]*=[[:space:]]*java' \
              buildozer.spec

            echo "===== CHECKING TFLITE BRIDGE ====="

            grep -F \
              "class TFLiteBridge" \
              java/org/gothicocr/TFLiteBridge.java

            echo "Buildozer configuration validated."


      # ============================================================
      # 8. CONFIGURE JAVA 17
      # ============================================================
      - run:
          name: Configure Java 17
          command: |
            set -eux

            echo 'export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64' >> "$BASH_ENV"
            echo 'export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH' >> "$BASH_ENV"

            source "$BASH_ENV"

            echo "JAVA_HOME=$JAVA_HOME"

            java -version
            javac -version


      # ============================================================
      # 9. CONFIGURE ANDROID SDK AND NDK
      # ============================================================
      - run:
          name: Configure Android SDK and NDK
          command: |
            set -eux

            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/home/circleci/android-sdk}}"

            NDK_ROOT="/home/circleci/android-sdk/ndk/28.2.13676358"

            test -d "$SDK_ROOT"
            test -d "$NDK_ROOT"

            echo "export ANDROID_HOME=$SDK_ROOT" >> "$BASH_ENV"
            echo "export ANDROID_SDK_ROOT=$SDK_ROOT" >> "$BASH_ENV"

            echo "export ANDROIDSDK=$SDK_ROOT" >> "$BASH_ENV"
            echo "export ANDROIDNDK=$NDK_ROOT" >> "$BASH_ENV"

            echo "export ANDROIDAPI=35" >> "$BASH_ENV"
            echo "export NDKAPI=23" >> "$BASH_ENV"

            source "$BASH_ENV"

            echo "ANDROIDSDK=$ANDROIDSDK"
            echo "ANDROIDNDK=$ANDROIDNDK"

            ls -la "$ANDROIDSDK"
            ls -la "$ANDROIDNDK" | head


      # ============================================================
      # 10. ACCEPT ANDROID LICENSES
      # ============================================================
      - run:
          name: Accept Android SDK licenses
          command: |
            set -eux

            source "$BASH_ENV"

            echo "===== ACCEPTING ANDROID LICENSES ====="

            set +e

            yes | sdkmanager --licenses >/dev/null 2>&1

            SDKMANAGER_STATUS=${PIPESTATUS[1]}

            set -e

            if [ "$SDKMANAGER_STATUS" -ne 0 ]
            then
              echo "WARNING: License command returned status $SDKMANAGER_STATUS"
            fi

            echo "Android SDK license step completed."


      # ============================================================
      # 11. INSTALL REQUIRED ANDROID SDK PACKAGES
      # ============================================================
      - run:
          name: Install Android SDK packages
          command: |
            set -eux

            source "$BASH_ENV"

            echo "=== Installing Android SDK packages ==="

            sdkmanager \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              "cmdline-tools;latest"

            echo "=== Android SDK setup completed ==="

            echo "===== VERIFYING SDK COMPONENTS ====="

            test -d "$ANDROIDSDK/platform-tools"
            test -d "$ANDROIDSDK/platforms/android-35"
            test -d "$ANDROIDSDK/build-tools/35.0.0"
            test -f "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager"

            echo "===== INSTALLED SDK COMPONENTS ====="

            sdkmanager --list_installed 2>/dev/null | grep -E \
              "platform-tools|platforms;android-35|build-tools;35.0.0|cmdline-tools" || true


      # ============================================================
      # 12. VERIFY AIDL
      # ============================================================
      - run:
          name: Verify AIDL
          command: |
            set -eux

            source "$BASH_ENV"

            AIDL="$ANDROIDSDK/build-tools/35.0.0/aidl"

            if [ ! -f "$AIDL" ]
            then
              echo "ERROR: AIDL not found at:"
              echo "$AIDL"
              exit 1
            fi

            echo "AIDL found:"
            echo "$AIDL"


      # ============================================================
      # 13. PREPARE BUILDOZER SDK/NDK PATHS
      # ============================================================
      - run:
          name: Configure Buildozer Android paths
          command: |
            set -eux

            source "$BASH_ENV"

            mkdir -p ~/.buildozer/android/platform

            rm -rf ~/.buildozer/android/platform/android-sdk
            rm -rf ~/.buildozer/android/platform/android-ndk-r28c

            ln -s \
              "$ANDROIDSDK" \
              ~/.buildozer/android/platform/android-sdk

            ln -s \
              "$ANDROIDNDK" \
              ~/.buildozer/android/platform/android-ndk-r28c

            echo "===== FIX SDKMANAGER FOR JAVA 17 ====="

            MODERN_SDKMANAGER="$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager"

            test -f "$MODERN_SDKMANAGER"

            mkdir -p \
              "$ANDROIDSDK/tools/bin"

            rm -f \
              "$ANDROIDSDK/tools/bin/sdkmanager"

            ln -s \
              "$MODERN_SDKMANAGER" \
              "$ANDROIDSDK/tools/bin/sdkmanager"

            echo "===== VERIFY MODERN SDKMANAGER ====="

            "$ANDROIDSDK/tools/bin/sdkmanager" --version

            echo "===== BUILDOZER ANDROID LINKS ====="

            ls -la ~/.buildozer/android/platform

            echo "===== SDK BUILD TOOLS ====="

            ls -la \
              ~/.buildozer/android/platform/android-sdk/build-tools/35.0.0

            echo "===== AIDL ====="

            test -f \
              ~/.buildozer/android/platform/android-sdk/build-tools/35.0.0/aidl

            echo "===== SDKMANAGER LINK ====="

            ls -la \
              ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager


      # ============================================================
      # 14. VALIDATE GOTHIC TFLITE MODEL
      # ============================================================
      - run:
          name: Validate Gothic OCR model
          command: |
            set -eux

            echo "===== MODEL ====="

            ls -lh models/gothic_ocr.tflite

            MODEL_SIZE=$(stat -c%s models/gothic_ocr.tflite)

            echo "Model size: $MODEL_SIZE bytes"

            if [ "$MODEL_SIZE" -lt 1000 ]
            then
              echo "ERROR: TFLite model is empty or invalid."
              exit 1
            fi

            echo "Model validation successful."


      # ============================================================
      # 15. VALIDATE LABELS
      # ============================================================
      - run:
          name: Validate Gothic labels
          command: |
            set -eux

            test -s data/labels.json

            echo "===== LABEL FILE ====="

            ls -lh data/labels.json

            echo "===== LABEL CONTENT ====="

            head -50 data/labels.json || true

            echo "Labels validation successful."


      # ============================================================
      # 16. VALIDATE GOTHIC FONT
      # ============================================================
      - run:
          name: Validate Gothic font
          command: |
            set -eux

            test -s fonts/NotoSansGothic-Regular.ttf

            FONT_SIZE=$(stat -c%s fonts/NotoSansGothic-Regular.ttf)

            echo "Gothic font size: $FONT_SIZE bytes"

            if [ "$FONT_SIZE" -lt 1000 ]
            then
              echo "ERROR: Gothic font appears invalid."
              exit 1
            fi

            echo "Gothic font validation successful."


      # ============================================================
      # 17. FINAL PRE-BUILD CHECK
      # ============================================================
      - run:
          name: Final pre-build verification
          command: |
            set -eux

            source "$BASH_ENV"
            source ~/buildozer-venv/bin/activate

            echo "=========================================="
            echo "       FINAL GOTHIC OCR CHECK"
            echo "=========================================="

            echo "===== PYTHON ====="
            python --version

            echo "===== CYTHON ====="
            cython --version

            echo "===== BUILDOZER ====="
            buildozer --version

            echo "===== JAVA ====="
            java -version
            javac -version

            echo "===== SDK ====="
            echo "$ANDROIDSDK"

            echo "===== NDK ====="
            echo "$ANDROIDNDK"

            echo "===== API ====="
            echo "$ANDROIDAPI"

            echo "===== NDK API ====="
            echo "$NDKAPI"

            echo "===== AIDL ====="

            test -f \
              "$ANDROIDSDK/build-tools/35.0.0/aidl"

            echo "===== MODERN SDKMANAGER ====="

            test -f \
              "$ANDROIDSDK/cmdline-tools/latest/bin/sdkmanager"

            echo "===== BUILDOZER SDKMANAGER ====="

            test -L \
              "$ANDROIDSDK/tools/bin/sdkmanager"

            echo "===== MODEL ====="

            test -f \
              models/gothic_ocr.tflite

            echo "===== LABELS ====="

            test -f \
              data/labels.json

            echo "===== FONT ====="

            test -f \
              fonts/NotoSansGothic-Regular.ttf

            echo "===== JAVA BRIDGE ====="

            test -f \
              java/org/gothicocr/TFLiteBridge.java

            echo "===== DISK ====="

            df -h

            echo "=========================================="
            echo "PRE-BUILD VALIDATION PASSED"
            echo "=========================================="


      # ============================================================
      # 18. CLEAN OLD OUTPUT
      # ============================================================
      - run:
          name: Clean old output
          command: |
            set -eux

            rm -rf bin

            echo "Old APK output removed."


      # ============================================================
      # 19. SMART ANDROID BUILD
      # ============================================================
      - run:
          name: Smart Android Build
          no_output_timeout: 40m
          command: |
            set -e

            source "$BASH_ENV"
            source ~/buildozer-venv/bin/activate

            LOG=/tmp/gothic_build.log

            run_build() {

              rm -f "$LOG"

              set +e

              buildozer -v android debug 2>&1 | tee "$LOG"

              STATUS=${PIPESTATUS[0]}

              set -e

              return "$STATUS"
            }

            echo "=========================================="
            echo "      GOTHIC OCR SMART ANDROID BUILD"
            echo "=========================================="

            echo "===== BUILD ATTEMPT 1 ====="

            if run_build
            then
              echo "=========================================="
              echo "       BUILD SUCCESS"
              echo "=========================================="

              exit 0
            fi


            # ========================================================
            # ANALYZE BUILD ERROR
            # ========================================================

            echo "=========================================="
            echo "      ANALYZING BUILD ERROR"
            echo "=========================================="

            echo "===== ERROR MATCHING ====="

            grep -iE \
              "error|failed|exception|traceback" \
              "$LOG" | tail -50 || true


            # ========================================================
            # FIX A — ANDROID SDK / AIDL / LICENSE
            # ========================================================

            if grep -qiE \
              "aidl not found|license.*not accepted|licenses|Skipping following packages|sdkmanager"
              "$LOG"
            then

              echo "=========================================="
              echo " DETECTED ANDROID SDK / AIDL PROBLEM"
              echo "=========================================="

              echo "===== ACCEPT LICENSES ====="

              yes | sdkmanager --licenses >/dev/null 2>&1 || true

              echo "===== INSTALL ANDROID PACKAGES ====="

              sdkmanager \
                "platform-tools" \
                "platforms;android-35" \
                "build-tools;35.0.0" \
                "cmdline-tools;latest"

              echo "===== VERIFY AIDL ====="

              test -f \
                "$ANDROIDSDK/build-tools/35.0.0/aidl"

              echo "===== RETRY AFTER AIDL FIX ====="

              if run_build
              then

                echo "=========================================="
                echo " BUILD SUCCESS AFTER AIDL FIX"
                echo "=========================================="

                exit 0

              fi

            fi


            # ========================================================
            # FIX B — FREETYPE / SAVANNAH / HTTP 504
            # ========================================================

            if grep -qiE \
              "freetype|savannah|HTTP Error 504|Gateway Time-out|504 Gateway"
              "$LOG"
            then

              echo "=========================================="
              echo " DETECTED FREETYPE DOWNLOAD PROBLEM"
              echo "=========================================="

              rm -rf /tmp/freetype-src
              rm -rf /tmp/freetype-extract

              rm -f /tmp/freetype.tar.gz

              mkdir -p /tmp/freetype-extract

              echo "===== DOWNLOADING FREETYPE ====="

              curl \
                -L \
                --retry 8 \
                --retry-all-errors \
                --retry-delay 10 \
                --connect-timeout 30 \
                --max-time 300 \
                -o /tmp/freetype.tar.gz \
                https://ftpmirror.gnu.org/freetype/freetype-2.14.1.tar.gz

              echo "===== VERIFY FREETYPE ARCHIVE ====="

              test -s /tmp/freetype.tar.gz

              echo "===== EXTRACT FREETYPE ====="

              tar \
                -xzf /tmp/freetype.tar.gz \
                -C /tmp/freetype-extract

              mv \
                /tmp/freetype-extract/freetype-2.14.1 \
                /tmp/freetype-src

              export P4A_freetype_DIR=/tmp/freetype-src

              echo "P4A_freetype_DIR=$P4A_freetype_DIR"

              echo "===== RETRY AFTER FREETYPE FIX ====="

              if run_build
              then

                echo "=========================================="
                echo " BUILD SUCCESS AFTER FREETYPE FIX"
                echo "=========================================="

                exit 0

              fi

            fi


            # ========================================================
            # FIX C — GENERAL BUILD CACHE / STALE BUILD
            # ========================================================

            if grep -qiE \
              "buildozer|python-for-android|gradle|recipe|failed to build|command failed"
              "$LOG"
            then

              echo "=========================================="
              echo " DETECTED GENERAL BUILD FAILURE"
              echo "=========================================="

              echo "===== CLEANING TEMPORARY BUILD CACHE ====="

              rm -rf .buildozer/android/platform/build-* || true

              rm -rf .buildozer/android/platform/python-for-android || true

              echo "===== RETRY AFTER BUILD CACHE CLEAN ====="

              if run_build
              then

                echo "=========================================="
                echo " BUILD SUCCESS AFTER CACHE CLEAN"
                echo "=========================================="

                exit 0

              fi

            fi


            # ========================================================
            # FINAL FAILURE
            # ========================================================

            echo "=========================================="
            echo "       GOTHIC OCR BUILD FAILED"
            echo "=========================================="

            echo "===== LAST 150 LINES ====="

            tail -150 "$LOG"

            echo "=========================================="
            echo " FULL BUILD LOG:"
            echo "$LOG"
            echo "=========================================="

            exit 1


      # ============================================================
      # 20. VERIFY APK
      # ============================================================
      - run:
          name: Verify generated APK
          command: |
            set -eux

            if [ ! -d bin ]
            then
              echo "ERROR: bin directory does not exist."
              exit 1
            fi

            echo "=========================================="
            echo "             APK FILES"
            echo "=========================================="

            find bin \
              -type f \
              -name "*.apk" \
              -print

            APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

            if [ "$APK_COUNT" -lt 1 ]
            then
              echo "ERROR: No APK generated."
              exit 1
            fi

            echo "===== APK COUNT ====="

            echo "$APK_COUNT"

            echo "===== APK DETAILS ====="

            find bin \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \;

            echo "=========================================="
            echo "      GOTHIC OCR APK BUILD SUCCESSFUL"
            echo "=========================================="


      # ============================================================
      # 21. SAVE APK
      # ============================================================
      - store_artifacts:
          path: bin
          destination: GothicOCR2-APK


      # ============================================================
      # 22. SAVE BUILD LOG
      # ============================================================
      - run:
          name: Prepare build diagnostics
          when: always
          command: |
            set +e

            echo "===== BUILD DIAGNOSTICS ====="

            if [ -f /tmp/gothic_build.log ]
            then
              mkdir -p build_logs
              cp /tmp/gothic_build.log build_logs/gothic_build.log
            fi

            if [ -d bin ]
            then
              find bin \
                -type f \
                -name "*.apk" \
                -exec ls -lh {} \;
            fi


      - store_artifacts:
          path: build_logs
          destination: GothicOCR2-BuildLogs


workflows:
  build_android:
    jobs:
      - build_android
